name: Build and Deploy (Local Builder)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy via Docker Compose
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Environment Secrets (.env)
        run: |
          if [ ! -f .env ]; then
            echo "Checking for host .env or injecting secrets..."
            # If you prefer storing secrets in GitHub Secrets:
            # echo "${{ secrets.PROD_ENV_FILE }}" > .env
            # Or if .env is pre-created on the host:
            if [ -f ../.env ]; then
              cp ../.env .env
            else
              echo "ERROR: .env file missing on host builder!" && exit 1
            fi
          fi

      - name: Ensure Database is Running
        run: |
          # 1. Build db image only if it does not exist locally or docker/ changed
          REBUILD_DB=false
          if ! docker image inspect przetrwaj-postgres:18 >/dev/null 2>&1; then
            echo "Image przetrwaj-postgres:18 not found locally."
            REBUILD_DB=true
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1 && git diff --name-only HEAD~1 HEAD | grep -q '^docker/'; then
            echo "Changes detected in docker/ directory."
            REBUILD_DB=true
          fi

          if [ "$REBUILD_DB" = "true" ]; then
            echo "Building custom postgres:18 + PostGIS image..."
            docker compose build db
          else
            echo "Reusing existing local przetrwaj-postgres:18 image (skipping rebuild)."
          fi

          # 2. Start PostgreSQL service
          echo "Starting database service..."
          docker compose down db
          docker compose up -d db

          # 3. Wait for PostgreSQL to become healthy
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..20}; do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' przetrwaj_db || echo "starting")
            echo "Database status: $STATUS"
            if [ "$STATUS" = "\"healthy\"" ]; then
              echo "Database is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "Database health check timed out!"
          docker logs przetrwaj_db
          exit 1

      - name: Apply EF Core Migrations
        run: |
          echo "Applying database migrations..."
          export PATH="$PATH:$HOME/.dotnet:$HOME/.dotnet/tools"

          # Load environment secrets
          set -a
          [ -f .env ] && . ./.env
          set +a

          export ConnectionStrings__Database="Host=localhost;Port=5432;Database=${POSTGRES_DB:-przetrwaj};Username=${POSTGRES_USER:-przetrwaj_user};Password=${POSTGRES_PASSWORD};"
          export PostGis__schema="${PostGis__schema:-postgis}"

          export PATH="$HOME/.dotnet:$HOME/.dotnet/tools:/usr/share/dotnet:$PATH"
          export DOTNET_ROOT="$HOME/.dotnet"

          # 1. If dotnet is not installed on the runner host, install .NET 9 in user space (no root/sudo required)
          if ! command -v dotnet >/dev/null 2>&1; then
            echo "Installing .NET 9 SDK in $HOME/.dotnet (non-root)..."
            curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 9.0 --install-dir "$HOME/.dotnet"
          fi

          # 2. Ensure dotnet-ef tool is installed
          if ! command -v dotnet-ef >/dev/null 2>&1; then
            echo "Installing dotnet-ef tool..."
            dotnet tool install --global dotnet-ef || true
          fi

          # 3. Apply migrations
          cd PrzetrwajApi
          dotnet ef database update --startup-project Przetrwaj.Api --project Przetrwaj.Infrastucture

      - name: Build and Start Application Containers
        run: |
          # 1. Build application containers with latest code changes
          echo "Building api and front..."
          docker compose build api front
          docker compose down api front

          # 2. Start/update containers (recreates updated containers, keeps db running)
          docker compose up -d --remove-orphans

      - name: Verify API Health Check
        run: |
          echo "Waiting for API service to become healthy..."
          for i in {1..15}; do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' przetrwaj_api || echo "starting")
            echo "Current status: $STATUS"
            if [ "$STATUS" = "\"healthy\"" ]; then
              echo "API is healthy!"
              exit 0
            fi
            sleep 4
          done
          echo "Health check timed out!"
          docker logs przetrwaj_api
          exit 1

      - name: Clean Up Dangling Images
        if: always()
        run: |
          docker image prune -f